version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

# Cargo is added when service/Cargo.toml and Cargo.lock reach the default branch.
# See docs/CI.md for the reviewed extension; the current remote is Phase 1.
