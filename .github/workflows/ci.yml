name: Windows governance and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veil-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Governance and x64 Release build
        shell: pwsh
        run: ./scripts/verify.ps1 -SkipInteractive -ConfigureArgs '-A', 'x64'
      - name: Explain evidence limits
        shell: pwsh
        run: Write-Output 'CI does not validate screen capture, WDA, GPU behavior or interactive desktop compatibility.'
